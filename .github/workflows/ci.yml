name: Continuous Integration

on:
  push:
    branches:
    - main
    tags:
    - "*"
  pull_request:
  schedule:
    - cron: '30 2 * * 1,4' # Every Monday and Thursday @ 2h30am UTC
  workflow_dispatch:

jobs:
  check_skip:
    runs-on: ubuntu-latest
    if: |
      !contains(format('{0} {1} {2}', github.event.head_commit.message, github.event.pull_request.title, github.event.pull_request.body), '[skip ci]')
    steps:
      - run: |
          cat <<'MESSAGE'
          github.event_name: ${{ toJson(github.event_name) }}
          github.event:
          ${{ toJson(github.event) }}
          MESSAGE
  test:
    needs: check_skip
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-15"]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
        numpy-version: ["latest"]
        include:
          # The oldest NumPy we claim to support
          - os: "ubuntu-latest"
            python-version: "3.11"
            numpy-version: "2.0.0"

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Create virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -U pip

      - name: Install numba-ufunc-hooks
        run: |
          source .venv/bin/activate
          pip install --group test .

      - name: Pin NumPy ${{ matrix.numpy-version }}
        if: matrix.numpy-version != 'latest'
        run: |
          source .venv/bin/activate
          pip install "numpy==${{ matrix.numpy-version }}"

      - name: Test numba-ufunc-hooks
        run: |
          source .venv/bin/activate
          python -c "import numpy, numba, sys; print(sys.version, numpy.__version__, numba.__version__)"
          py.test -s -vvv tests/ -Werror

      # Retest to ensure caching works
      - name: Test numba-ufunc-hooks
        run: |
          source .venv/bin/activate
          py.test -s -vvv tests/ -Werror

      # - name: Debug with tmate on failure
      #   if: ${{ failure() }}
      #   uses: mxschmitt/action-tmate@v3

  # Early warning of NumPy changing the PyUFuncObject layout or the
  # pocketfft ufuncs. Released Numba refuses unreleased NumPy versions,
  # so Numba and llvmlite come from their dev channel too.
  numpy-nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Create virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -U pip

      - name: Install numba-ufunc-hooks with nightly NumPy and dev Numba
        run: |
          source .venv/bin/activate
          pip install --group test .
          pip install --pre --upgrade --only-binary :all: \
            --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple \
            --extra-index-url https://pypi.anaconda.org/numba/label/dev/simple \
            numpy numba llvmlite

      - name: Test numba-ufunc-hooks
        run: |
          source .venv/bin/activate
          python -c "import numpy, numba, sys; print(sys.version, numpy.__version__, numba.__version__)"
          py.test -s -vvv tests/ -Werror

      # Retest to ensure caching works
      - name: Test numba-ufunc-hooks
        run: |
          source .venv/bin/activate
          py.test -s -vvv tests/ -Werror

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https:/pypi.org/p/numba-ufunc-hooks
    permissions:
      id-token: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build distributions
        run: |
          pip install -U pip build
          python -m build --sdist --wheel

      - name: Publish distribution 📦 to PyPI
        if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
